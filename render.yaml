services:
  - type: web
    name: wakemeup-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn geofence_backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: wakemeup-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "wakemeup-fq0i.onrender.com"

databases:
  - name: wakemeup-db
    plan: free
